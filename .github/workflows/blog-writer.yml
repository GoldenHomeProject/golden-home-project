name: GHP Blog Writer (Agent 4 — Flywheel S3)

# Manual-only. Scheduled runs happen on the Pi (see note below).
# Writes one 1,800-2,400 word SEO blog post per run
# Target: 260 posts/year, compounding organic traffic
# Based on highest-composite trend from social/trend_feed.json

# NOTE 2026-07-30: the SEO writer runs DAILY on the Pi (cron 07:15), not here.
# The Pi can verify Amazon listings (Actions runner IPs are bot-walled) and owns the
# keyword queue. The old 1x/week schedule protected a GSC test dated 2026-06-05 and
# was leaving 39 real queries unused while the non-ranking trending engine posted
# daily. The `schedule:` key is REMOVED, not commented out: leaving the key present
# with no cron entries under it is invalid and made every push fail with
# "No jobs were run" (run 30601995023). Manual runs still work via workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node (for Claude CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run blog writer
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 automation/blog_writer.py

      - name: Commit new post + index
        run: |
          git config user.name "GHP Blog Writer"
          git config user.email "goldenhomeprojectllc@gmail.com"
          git add blog/ || true
          git diff --staged --quiet || git commit -m "Blog post: $(date -u +%Y-%m-%d)"
          # `git push || true` swallowed the failure, so a run that lost its work
          # still went green. On 2026-08-27 the reel producer rendered three videos,
          # committed them, lost the push to a concurrent job, and reported success —
          # the poster then found no video for two days running. Retry against the
          # remote, and fail loudly if the work truly cannot be persisted.
          for i in 1 2 3 4 5; do
            # Leave no half-finished rebase behind: the first conflict used to strand
            # the tree in an unmerged state, and every remaining retry then died with
            # "Pulling is not possible because you have unmerged files."
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --quiet origin main && git push --quiet origin main; then
              echo "[commit] pushed"
              exit 0
            fi
            # These artifacts are regenerated wholesale each run, so on a conflict the
            # freshly generated copy wins. Inside a rebase, --theirs is the commit
            # being replayed, i.e. ours.
            CONFLICTED=$(git diff --name-only --diff-filter=U)
            if [ -n "$CONFLICTED" ]; then
              echo "[commit] resolving conflicts in: $CONFLICTED"
              git checkout --theirs -- $CONFLICTED 2>/dev/null || true
              git add $CONFLICTED
              GIT_EDITOR=true git rebase --continue || git rebase --abort 2>/dev/null || true
              if git push --quiet origin main; then
                echo "[commit] pushed after conflict resolution"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error title=Push failed::work committed locally but NOT pushed after 5 tries"
          exit 1
