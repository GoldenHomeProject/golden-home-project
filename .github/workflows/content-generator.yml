name: GHP Content Engine (Agent 2 — Flywheel S2)

# Runs daily at 06:00 UTC (02:00 ET), 1h after trend-scout
# Consumes social/trend_feed.json
# Produces 3 Reel scripts per day using AIDA + Grand Slam Offer frameworks
# Outputs: automation/scripts/reel-<date>-NNN.json + queue entries

on:
  # Re-enabled 2026-05-11 per CEO directive (parallel tracks + per-channel attribution).
  # Per-channel kill: if 14 days post-resume produce $0 attributed revenue AND no leading-indicator
  # delta (IG comments+saves, YT watch-time, click-through to /links.html), this cron pauses again
  # and the channel is logged as dead in learnings_log.jsonl.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node (for Claude CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run content engine
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 automation/content_engine.py

      - name: Run content quality gate (rejects off-brand scripts)
        run: python3 automation/content_quality_gate.py

      - name: Commit scripts and queue updates
        run: |
          git config user.name "GHP Content Engine"
          git config user.email "goldenhomeprojectllc@gmail.com"
          git add automation/scripts/ social/post_queue.json automation/content-review-queue/ AGENT_LOG.md || true
          git diff --staged --quiet || git commit -m "Content engine: $(date -u +%Y-%m-%d)"
          # `git push || true` swallowed the failure, so a run that lost its work
          # still went green. On 2026-08-27 the reel producer rendered three videos,
          # committed them, lost the push to a concurrent job, and reported success —
          # the poster then found no video for two days running. Retry against the
          # remote, and fail loudly if the work truly cannot be persisted.
          for i in 1 2 3 4 5; do
            if git pull --rebase --quiet origin main && git push --quiet origin main; then
              echo "[commit] pushed"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Push failed::work committed locally but NOT pushed after 5 tries"
          exit 1
