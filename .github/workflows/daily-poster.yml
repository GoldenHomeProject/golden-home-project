name: GHP Daily YouTube Poster

# Runs at noon ET (17:00 UTC) every day
# Posts 1 pre-generated transformation reel to YouTube
# IG Reels posted on Saturdays only
# NO Claude API needed — pure Python + YouTube Data API

on:
  # Re-enabled 2026-05-11 per CEO directive (parallel tracks).
  # Each post carries ascsubtag=ghp-yt-YYYYMMDD on the affiliate link in the description for
  # attribution. 14-day kill: if 0 clicks bearing this subtag arrive in Amazon Associates
  # earnings report, this cron pauses again.
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Override date (YYYY-MM-DD) to post a missed day'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  post-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-auth google-auth-oauthlib google-api-python-client requests jq

      - name: Write credentials
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
        run: |
          echo "$YT_TOKEN_JSON" > /tmp/yt_token.json
          # Use jq to safely construct JSON — prevents injection if token contains special chars
          jq -n \
            --arg tok "$META_ACCESS_TOKEN" \
            --arg id "$IG_BUSINESS_ACCOUNT_ID" \
            '{"page_access_token": $tok, "ig_business_account_id": $id}' \
            > /tmp/meta_tokens.json

      - name: Post today's video
        env:
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          DATE_OVERRIDE: ${{ github.event.inputs.date }}
        run: |
          DATE_ARG=""
          if [ -n "$DATE_OVERRIDE" ]; then
            if ! printf '%s' "$DATE_OVERRIDE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "ERROR: --date must be YYYY-MM-DD; got: $DATE_OVERRIDE"
              exit 1
            fi
            DATE_ARG="--date $DATE_OVERRIDE"
          fi
          python3 automation/github_daily_poster.py \
            --yt-token /tmp/yt_token.json \
            --meta-token /tmp/meta_tokens.json \
            --associate-tag "$AMAZON_ASSOCIATE_TAG" \
            $DATE_ARG

      - name: Commit posting log
        run: |
          git config user.name "GHP Bot"
          git config user.email "goldenhomeprojectllc@gmail.com"
          git add automation/logs/gh_post_*.json || true
          git diff --staged --quiet || git commit -m "Daily post log $(date +%Y-%m-%d)"
          # `git push || true` swallowed the failure, so a run that lost its work
          # still went green. On 2026-08-27 the reel producer rendered three videos,
          # committed them, lost the push to a concurrent job, and reported success —
          # the poster then found no video for two days running. Retry against the
          # remote, and fail loudly if the work truly cannot be persisted.
          for i in 1 2 3 4 5; do
            if git pull --rebase --quiet origin main && git push --quiet origin main; then
              echo "[commit] pushed"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Push failed::work committed locally but NOT pushed after 5 tries"
          exit 1

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/yt_token.json /tmp/meta_tokens.json
