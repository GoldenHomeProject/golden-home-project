name: GHP Repurposer (Agent 5 — Flywheel S5)

# Runs Mondays at 09:00 UTC
# Takes latest blog post → 5 Reels + 5 Pins + 1 Email + 10 microcopy hooks
# Content multiplier: 1 asset → 20 derivatives

on:
  # Re-enabled 2026-05-11 per CEO directive. Each derivative inherits its origin's ascsubtag
  # so we can attribute attribution from Pin/email/reel back to the source blog post.
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repurpose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node (for Claude CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run repurposer
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 automation/repurpose.py

      - name: Commit derivatives
        run: |
          git config user.name "GHP Repurposer"
          git config user.email "goldenhomeprojectllc@gmail.com"
          git add automation/scripts/ automation/pinterest/ automation/email/ automation/microcopy/ social/post_queue.json || true
          git diff --staged --quiet || git commit -m "Repurpose: $(date -u +%Y-%m-%d)"
          # `git push || true` swallowed the failure, so a run that lost its work
          # still went green. On 2026-08-27 the reel producer rendered three videos,
          # committed them, lost the push to a concurrent job, and reported success —
          # the poster then found no video for two days running. Retry against the
          # remote, and fail loudly if the work truly cannot be persisted.
          for i in 1 2 3 4 5; do
            # Leave no half-finished rebase behind: the first conflict used to strand
            # the tree in an unmerged state, and every remaining retry then died with
            # "Pulling is not possible because you have unmerged files."
            git rebase --abort 2>/dev/null || true
            if git pull --rebase --quiet origin main && git push --quiet origin main; then
              echo "[commit] pushed"
              exit 0
            fi
            # These artifacts are regenerated wholesale each run, so on a conflict the
            # freshly generated copy wins. Inside a rebase, --theirs is the commit
            # being replayed, i.e. ours.
            CONFLICTED=$(git diff --name-only --diff-filter=U)
            if [ -n "$CONFLICTED" ]; then
              echo "[commit] resolving conflicts in: $CONFLICTED"
              git checkout --theirs -- $CONFLICTED 2>/dev/null || true
              git add $CONFLICTED
              GIT_EDITOR=true git rebase --continue || git rebase --abort 2>/dev/null || true
              if git push --quiet origin main; then
                echo "[commit] pushed after conflict resolution"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error title=Push failed::work committed locally but NOT pushed after 5 tries"
          exit 1
