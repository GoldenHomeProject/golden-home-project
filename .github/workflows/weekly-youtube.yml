name: GHP Weekly YouTube Video

# One landscape video a week stitched from the daily Shorts. Shorts description links are
# not tappable in the Shorts player; a regular video's links are (Ian, 2026-11-03).
on:
  schedule:
    - cron: '0 16 * * 0'   # Sunday 16:00 UTC (11:00 ET)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-open-sans
          pip install requests pillow

      - name: Write credentials
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: echo "$YT_TOKEN_JSON" > /tmp/yt_token.json

      - name: Build and upload the weekly video
        run: python3 automation/weekly_youtube.py --yt-token /tmp/yt_token.json

      - name: Commit log
        run: |
          git config user.name "GHP Bot"
          git config user.email "goldenhomeprojectllc@gmail.com"
          git add automation/logs/yt_weekly_*.json || true
          git diff --staged --quiet && exit 0
          git commit -m "Weekly YouTube log $(date +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin main && exit 0
            sleep $((i * 5))
          done
          echo "::error title=Push failed::weekly log not pushed"; exit 1
