name: Deploy site to Pages

# WHY THIS EXISTS (2026-08-17)
# The default branch-based Pages build packages the ENTIRE repo. That artifact reached
# 1,760,829,340 bytes against GitHub's 1 GB limit, and deploys started failing with
# "Uploaded artifact size exceeds the allowed size of 1 GB".
#
# The bulk is generated social media that has already been posted:
#   social/carousels 1.1 GB · social/reels 383 MB · social/pinterest 102 MB · videos 153 MB
# Those files only need a public URL at the MOMENT Meta/Pinterest/YouTube fetch them to
# create a post. Republishing three months of already-posted media on every deploy buys
# nothing and was about to break the site permanently.
#
# So we publish the site plus a rolling window of recent media. NOTHING IS DELETED — every
# old file stays in git exactly where it was, it simply stops being copied into the
# website artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          set -euo pipefail
          mkdir -p _site
          # Site itself: pages, styling, and the files search engines need.
          # Copy EVERY root-level .html, not a hardcoded list. The allowlist silently
          # dropped about/contact/privacy the day they were added — the sitemap advertised
          # them while the pages 404'd. An allowlist of filenames is a trap for anything
          # added later.
          shopt -s nullglob
          for f in *.html; do cp "$f" _site/; done
          for p in blog assets images products sitemap.xml robots.txt CNAME .nojekyll; do
            [ -e "$p" ] && cp -r "$p" _site/ || true
          done
          # Small, permanently referenced media.
          mkdir -p _site/social
          [ -d social/product_images ] && cp -r social/product_images _site/social/ || true
          # Older transformation videos are still linked by queued posts and are static.
          [ -d videos ] && cp -r videos _site/ || true

      - name: Stage recent social media only
        run: |
          set -euo pipefail
          # Select by the DATE IN THE FILENAME, never by mtime. `git checkout` stamps every
          # file with the checkout time, so `find -mtime -21` matched the entire repo in CI
          # and staged all 1.77GB — it only looked correct when tested on a machine with
          # real mtimes. Our media is date-stamped (pin-2026-08-17-*.png,
          # reel-2026-08-17-001.mp4, carousels/2026-08-17-<asin>/), so the name is the
          # honest signal.
          python3 - <<'PYEOF'
          import re, shutil
          from datetime import date, timedelta
          from pathlib import Path

          WINDOW = 21          # longer than anything sits in a posting queue
          cutoff = date.today() - timedelta(days=WINDOW)
          site = Path("_site")
          datepat = re.compile(r"(20\d{2})-(\d{2})-(\d{2})")
          kept = skipped = 0

          for d in ("social/carousels", "social/reels", "social/pinterest"):
              src = Path(d)
              if not src.is_dir():
                  continue
              for f in src.rglob("*"):
                  if not f.is_file():
                      continue
                  m = datepat.search(str(f))
                  if m:
                      try:
                          when = date(int(m[1]), int(m[2]), int(m[3]))
                      except ValueError:
                          when = None
                  else:
                      when = None
                  # Undated files are rare and small (e.g. presenter assets); keep them.
                  if when is not None and when < cutoff:
                      skipped += 1
                      continue
                  dest = site / f
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(f, dest)
                  kept += 1
          print(f"media staged: {kept} kept, {skipped} skipped (older than {cutoff})")
          PYEOF
          echo "staged size:"; du -sh _site

      - name: Fail loudly if we are near the limit again
        run: |
          bytes=$(du -sb _site | cut -f1)
          echo "artifact bytes: $bytes"
          if [ "$bytes" -gt 900000000 ]; then
            echo "::error::_site is ${bytes} bytes, close to the 1 GB Pages limit. Shorten the media window."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
