name: GHP Reel Producer (Agent 3 — Flywheel S2)

# Runs daily at 07:00 UTC (03:00 ET), 1h after content-engine
# Renders today's Reel scripts into 1080x1920 MP4s via Pillow + edge-tts + ffmpeg
# Updates social/post_queue.json: status=ready, video_url=raw github URL

on:
  # Re-enabled 2026-05-11 per CEO directive. Downstream of content-generator.
  # Per-channel attribution: render output URLs flow through daily-poster, which now stamps
  # ascsubtag=ghp-reel-YYYYMMDD on the embedded Amazon affiliate link for attribution.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install Pillow edge-tts

      - name: Render Reels
        run: python3 automation/reel_producer.py

      - name: Commit Reel MP4s, queue, agent log
        if: always()
        run: |
          git config user.name "GHP Reel Producer"
          git config user.email "goldenhomeprojectllc@gmail.com"
          git add social/reels/ social/post_queue.json AGENT_LOG.md || true
          git diff --staged --quiet || git commit -m "Reel producer: $(date -u +%Y-%m-%d)"
          # `git push || true` swallowed the failure, so a run that lost its work
          # still went green. On 2026-08-27 the reel producer rendered three videos,
          # committed them, lost the push to a concurrent job, and reported success —
          # the poster then found no video for two days running. Retry against the
          # remote, and fail loudly if the work truly cannot be persisted.
          for i in 1 2 3 4 5; do
            if git pull --rebase --quiet origin main && git push --quiet origin main; then
              echo "[commit] pushed"
              exit 0
            fi
            sleep 5
          done
          echo "::error title=Push failed::work committed locally but NOT pushed after 5 tries"
          exit 1
